name: CPU tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cpu:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements/dev.lock.txt
      - run: python -m pip install -e . --no-deps --no-build-isolation
      - run: python -m pip check
      - run: python -m pytest -m "not gpu and not integration" -q
      - run: python -m ruff check .
      - run: python -m rag_cad.cli audit upstream
      - run: git diff --exit-code