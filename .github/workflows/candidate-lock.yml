name: Candidate Linux lock

on:
  push:
    branches: [phase1b-preparation]
    paths:
      - 'requirements/colab-core.in'
      - 'requirements/dev.in'
      - 'scripts/candidate_environment.py'
      - '.github/workflows/candidate-lock.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CUDA_VISIBLE_DEVICES: ''
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - run: python -m pip install -r requirements/dev.lock.txt
      - name: Resolve candidate on Linux CPU
        run: |
          mkdir -p "$RUNNER_TEMP/candidate-evidence"
          python -m piptools compile --resolver=backtracking --strip-extras --allow-unsafe --no-header --no-annotate --no-emit-index-url --no-emit-trusted-host --output-file "$RUNNER_TEMP/candidate-evidence/colab-core.candidate.lock.txt" requirements/colab-core.in
          python -m venv "$RUNNER_TEMP/candidate-venv"
          "$RUNNER_TEMP/candidate-venv/bin/python" -m pip install --no-cache-dir --report "$RUNNER_TEMP/candidate-evidence/install-report.json" -r "$RUNNER_TEMP/candidate-evidence/colab-core.candidate.lock.txt"
          "$RUNNER_TEMP/candidate-venv/bin/python" -m pip install -e . --no-deps --no-build-isolation
      - name: CPU-only acceptance in candidate dependencies
        run: |
          "$RUNNER_TEMP/candidate-venv/bin/python" -m pip check
          "$RUNNER_TEMP/candidate-venv/bin/python" -m pytest -m "not gpu and not integration" -q
          "$RUNNER_TEMP/candidate-venv/bin/python" -m ruff check .
          "$RUNNER_TEMP/candidate-venv/bin/python" -m rag_cad.cli audit upstream
          "$RUNNER_TEMP/candidate-venv/bin/python" scripts/candidate_environment.py --lock "$RUNNER_TEMP/candidate-evidence/colab-core.candidate.lock.txt" --install-report "$RUNNER_TEMP/candidate-evidence/install-report.json" --output "$RUNNER_TEMP/candidate-evidence/evidence.json"
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-linux-lock
          path: ${{ runner.temp }}/candidate-evidence/
          if-no-files-found: error
          retention-days: 14